<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient: Deep Emerald Green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Subtle Drop Shadow for contrast -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Gold Border Accent -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-opacity="0.9"/>

  <!-- Decorative Dot Accent -->
  <circle cx="50" cy="14" r="3.5" fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- OS Lettermark (Operator Santri) -->
  <g filter="url(#shadow)">
    <text x="31" y="44" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
          font-size="32" 
          font-weight="900" 
          letter-spacing="-1.5" 
          text-anchor="middle">
      <tspan fill="url(#goldGrad)">O</tspan><tspan fill="#ffffff">S</tspan>
    </text>
  </g>
</svg>
